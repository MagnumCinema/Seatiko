  /api/v1/venues/{id}/places:
    get:
      operationId: GetVenuePlaces
      summary: Get Venue Places
      tags:
        - Map and venues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  source:
                    type: string
                    enum:
                      - local
                      - google
                  google_place_id:
                    type: string
                  rating:
                    type: number
                  review_count:
                    type: integer
                  photo_urls:
                    type: array
                    items:
                      type: string
                    nullable: true
                  reviews:
                    type: array
                    items:
                      $ref: '#/components/schemas/VenueReview'
                    nullable: true
                  live_google:
                    type: boolean
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/venues/{id}/tables:
