openapi: 3.0.3
info:
  title: Seatiko API
  version: 1.0.0
  description: Map, restaurant administration, guest reservations, staff operations and Twenty CRM integration.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Health check
      tags:
        - Service
      description: Process health. CRM diagnostics are available on the integration status endpoint.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  crm:
                    $ref: '#/components/schemas/CRMStatus'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/integrations/twenty/status:
    get:
      operationId: CRMStatus
      summary: CRM Status
      tags:
        - CRM
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CRMStatus'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/integrations/twenty/webhook:
    post:
      operationId: TwentyWebhook
      summary: Twenty Webhook
      tags:
        - CRM
      description: Processes signed updates from Twenty CRM. Authenticate with both signature headers.
      parameters:
        - name: X-Twenty-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
        - name: X-Twenty-Webhook-Timestamp
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventName:
                  type: string
                record:
                  type: object
                  additionalProperties: true
                event:
                  type: string
                data:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  applied:
                    type: boolean
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/cities:
    get:
      operationId: ListCities
      summary: List Cities
      tags:
        - Map and venues
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/venues:
    get:
      operationId: ListVenues
      summary: List Venues
      tags:
        - Map and venues
      description: Lists the published Seatiko catalog in the selected city. Use all for Moldova.
      parameters:
        - name: city_id
          in: query
          required: false
          schema:
            type: string
            default: city-balti
          description: A city ID returned by GET /api/v1/cities, or all for Moldova.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  venues:
                    type: array
                    items:
                      $ref: '#/components/schemas/Venue'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/map/config:
    get:
      operationId: GetMapConfig
      summary: Get Map Config
      tags:
        - Map and venues
      description: Public map configuration and supported cities. The key, if set, is restricted to the Maps JavaScript
        API and allowed website referrers.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cities:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
                  country_bounds:
                    $ref: '#/components/schemas/MapBounds'
                  google_maps_key:
                    type: string
                  google_maps_id:
                    type: string
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/availability:
    get:
      operationId: SearchAvailability
      summary: Search Availability
      tags:
        - Map and venues
      description: Free tables across a city's venues for a party around the wanted time. A start is free when a
        reservation for that table and duration would be accepted, it lies inside the venue opening hours (Europe/Chisinau)
        and at least 15 minutes from now. The smallest fitting table is picked. Venues are sorted by exact match, then
        the closest free start, then rating; every venue of the city is returned so clients can show too-small or full
        venues. Rate limited to 60 requests per minute.
      parameters:
        - name: city_id
          in: query
          required: false
          schema:
            type: string
            default: city-balti
          description: A city ID returned by GET /api/v1/cities, or all.
        - name: at
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Wanted start (RFC 3339). Omit for the earliest free starts of the day.
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Local day (YYYY-MM-DD, Europe/Chisinau) when at is omitted. Defaults to today.
        - name: guests
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 2
        - name: duration_min
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 480
            default: 0
          description: Wanted booking length; each venue answers with its longest allowed length not above it. 0 is
            the venue default.
        - name: window_min
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 360
            default: 90
          description: How far from at a free start still matches.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 4
          description: Free starts per venue.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
                    example: Europe/Chisinau
                  venues:
                    type: array
                    items:
                      $ref: '#/components/schemas/VenueAvailability'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/map/places:
    get:
      operationId: ListMapPlaces
      summary: List Map Places
      tags:
        - Map and venues
      description: Searches the selected city or Moldova. A viewport is intersected with the selected area. Google
        returns up to 20 ranked results per search. Seatiko venues remain available when Google is disabled or unavailable.
      parameters:
        - name: city_id
          in: query
          required: false
          schema:
            type: string
            default: city-balti
          description: A city ID returned by GET /api/v1/cities, or all for Moldova.
        - name: bounds
          in: query
          required: false
          schema:
            type: string
          description: Optional viewport in south,west,north,east order. Example 46.92,28.72,47.12,29.02.
        - name: lang
          in: query
          required: false
          schema:
            type: string
            enum:
              - ru
              - en
              - ro
            default: ru
        - name: include_google
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: Set false to load Seatiko venues only.
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Search by venue name or street address in the selected area.
          example: Independenței 45
        - name: bookable_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Return Seatiko venues with a configured table layout. Skips Google Places.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapPlacesResponse'
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/places/photo:
    get:
      operationId: PlacePhoto
      summary: Place Photo
      tags:
        - Map and venues
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Google Places photo resource name.
      responses:
        '302':
          description: Found
          headers:
            Location:
              schema:
                type: string
                format: uri
        default:
          $ref: '#/components/responses/APIError'
  /api/v1/venues/{id}:
    get:
      operationId: GetVenue
      summary: Get Venue
      tags:
        - Map and venues
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
