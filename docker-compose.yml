name: virtual-restaurant

services:
  nginx:
    build:
      context: ./config/nginx
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:3000:80"
    depends_on:
      nest-api:
        condition: service_healthy
      web:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # The API behind /api/ (NestJS, ./backend).
      SEATIKO_API_UPSTREAM: ${SEATIKO_API_UPSTREAM:-nest-api:8080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    build:
      context: ./seatiko/apps/web
      dockerfile: Dockerfile
      args:
        # Browser calls same origin via nginx :80 → /api/...
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        # Demo sign-in buttons: only for a demo database (the site uses real data).
        NEXT_PUBLIC_DEMO_LOGIN: ${NEXT_PUBLIC_DEMO_LOGIN:-false}
    expose:
      - "3001"
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      nest-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # --- Seatiko API: NestJS (./backend) on PostgreSQL.
  seatiko-db:
    image: postgres:16
    environment:
      POSTGRES_DB: seatiko
      POSTGRES_USER: seatiko
      POSTGRES_PASSWORD: ${SEATIKO_DB_PASSWORD:-seatiko-dev-password}
    volumes:
      - seatiko-db-data:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5433:5432"
    healthcheck:
      test: pg_isready -U seatiko -d seatiko
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nest-api:
    build:
      context: ./backend
    expose:
      - "8080"
    networks:
      default:
        aliases: [api.seatiko.local]
    environment:
      ADDR: ":8080"
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev-seatiko-change-me}
      DATABASE_URL: postgres://seatiko:${SEATIKO_DB_PASSWORD:-seatiko-dev-password}@seatiko-db:5432/seatiko
      SEATIKO_ADMIN_EMAIL: ${SEATIKO_ADMIN_EMAIL:-}
      SEATIKO_ADMIN_PASSWORD: ${SEATIKO_ADMIN_PASSWORD:-}
      # Google map on the site needs a billing account; off = free OpenFreeMap map.
      GOOGLE_MAPS_ENABLED: ${GOOGLE_MAPS_ENABLED:-false}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      GOOGLE_MAPS_MAP_ID: ${GOOGLE_MAPS_MAP_ID:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      TWENTY_BASE_URL: http://twenty-server:3000
      TWENTY_PUBLIC_URL: ${SERVER_URL:-http://crm.localhost}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      TWENTY_WEBHOOK_SECRET: ${TWENTY_WEBHOOK_SECRET:-}
      TWENTY_SYNC_INTERVAL_SECONDS: ${TWENTY_SYNC_INTERVAL_SECONDS:-15}
      # Cafes and restaurants from OpenStreetMap + Overture, imported at start and refreshed weekly.
      OPEN_PLACES_CITIES: ${OPEN_PLACES_CITIES:-balti}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-seatiko}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-seatiko}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-seatiko-minio-dev-secret}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-/media}
    depends_on:
      seatiko-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # S3-compatible object storage: MinIO Community (Chainguard build; MinIO stopped
  # publishing free images in Oct 2025). For AWS S3 / R2 change the S3_* variables of nest-api.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-seatiko}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-seatiko-minio-dev-secret}
      MC_HOST_local: http://${MINIO_ROOT_USER:-seatiko}:${MINIO_ROOT_PASSWORD:-seatiko-minio-dev-secret}@127.0.0.1:9000
    volumes:
      - minio-data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Creates the bucket with public read (avatars are public URLs); exits when done.
  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-seatiko}:${MINIO_ROOT_PASSWORD:-seatiko-minio-dev-secret}@minio:9000
      BUCKET: ${S3_BUCKET:-seatiko}
    entrypoint: ["sh", "-c", "mc mb --ignore-existing local/$$BUCKET && mc anonymous set download local/$$BUCKET"]
    restart: "no"

  twenty-server:
    image: seatiko/twenty:${TWENTY_IMAGE_TAG:-v2.57.1}
    build:
      context: ./config/twenty
      args:
        TWENTY_IMAGE_TAG: ${TWENTY_IMAGE_TAG:-v2.57.1}
    stop_grace_period: 120s
    volumes:
      - twenty-server-data:/app/packages/twenty-server/.local-storage
    expose:
      - "3000"
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-twenty-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL:-http://crm.localhost}
      REDIS_URL: ${REDIS_URL:-redis://twenty-redis:6379}
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      # Local-only: Twenty must be allowed to deliver webhooks to the Docker network.
      # Keep the default safe mode enabled in production and use a public HTTPS endpoint.
      OUTBOUND_HTTP_SAFE_MODE_ENABLED: ${TWENTY_OUTBOUND_HTTP_SAFE_MODE_ENABLED:-false}
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  twenty-worker:
    image: seatiko/twenty:${TWENTY_IMAGE_TAG:-v2.57.1}
    build:
      context: ./config/twenty
      args:
        TWENTY_IMAGE_TAG: ${TWENTY_IMAGE_TAG:-v2.57.1}
    stop_grace_period: 120s
    volumes:
      - twenty-server-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-twenty-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL:-http://crm.localhost}
      REDIS_URL: ${REDIS_URL:-redis://twenty-redis:6379}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      APP_SECRET: ${APP_SECRET:-}
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      # Must match twenty-server so queued webhook jobs can reach the local API.
      OUTBOUND_HTTP_SAFE_MODE_ENABLED: ${TWENTY_OUTBOUND_HTTP_SAFE_MODE_ENABLED:-false}
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
    restart: unless-stopped

  twenty-db:
    image: postgres:16
    volumes:
      - twenty-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  twenty-redis:
    image: redis:7
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  seatiko-db-data:
  minio-data:
  twenty-db-data:
    name: twenty_db-data
  twenty-server-data:
    name: twenty_server-local-data
