# Seatiko — nginx (единая точка входа :80)
#
#   http://localhost/          → Next.js (web)
#   http://localhost/api/...   → Go API
#   http://localhost/healthz   → Go health
#   http://crm.localhost/      → Twenty CRM
#
# crm.localhost обычно резолвится в 127.0.0.1 (без правки /etc/hosts).

resolver 127.0.0.11 valid=5s ipv6=off;

upstream fa_web {
    zone seatiko_web 64k;
    server web:3001 resolve;
}

upstream fa_api {
    zone seatiko_api 64k;
    server api:8080 resolve;
}

upstream fa_crm {
    zone seatiko_crm 64k;
    server twenty-server:3000 resolve;
}

map $http_host $crm_port {
    default "";
    ~:(?<seatiko_port>[0-9]+)$ :$seatiko_port;
}

# ——— Seatiko app + API ———
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 _;

    client_max_body_size 32m;

    location /healthz {
        proxy_pass http://fa_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://fa_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://fa_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Optional convenience redirect
    location = /crm {
        return 302 http://crm.localhost$crm_port/;
    }

    location / {
        proxy_pass http://fa_web/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ——— Twenty CRM ———
server {
    listen 80;
    server_name crm.localhost;

    client_max_body_size 50m;

    location / {
        proxy_pass http://fa_crm/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
